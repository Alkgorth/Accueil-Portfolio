# nginx.conf — Config Nginx pour le portfolio statique
server {
    listen 80;
    server_name _;          # Accepte toutes les requêtes (Traefik filtre en amont)
    root /usr/share/nginx/html;
    index index.html;

    # ─── Compression gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/pdf image/svg+xml;
    gzip_min_length 1024;

    # ─── Cache pour les assets statiques ───────────────────────────────────
    location ~* \.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ─── En-têtes pour le PDF (affichage inline + téléchargement possible) ─
    location ~* \.pdf$ {
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff";
        expires 7d;
    }

    # ─── Route principale ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Masquer la version Nginx dans les headers ──────────────────────────
    server_tokens off;
}
